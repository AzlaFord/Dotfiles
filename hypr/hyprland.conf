
#exec
exec-once = waybar
exec = swaybg -i /home/bivol/Downloads/pisica.jpg -m fill
exec-once = ~/.local/bin/corner-image

# effecte
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2
}
animations {
    enabled = true

    animation = workspaces, 0, 0, default
}
# Keybindsw

bind = SUPER, TAB, cyclenext
bind = SUPER SHIFT, TAB, cyclenext, prev
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bindel = ,XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher
bind = SUPER, SPACE, exec, wofi --show drun
bind = SUPER, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = SUPER, B, exec, firefox
bind = , Print, exec, grim ~/Pictures/screen-$(date +%s).png
bind = SUPER, S, exec, grim -g "$(slurp)" - | wl-copy



input {
    natural_scroll = falsew
}
