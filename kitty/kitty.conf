# FONT
font_family      JetBrainsMono Nerd Font
font_size 12

# WINDOW
background #181a1f
foreground #e6e6e6

# TRANSPARENȚĂ (IMPORTANT)
background_opacity 0.92
dynamic_background_opacity yes

# CURSOR
cursor #ffffff

# SELECTION
selection_background #2a2d35
selection_foreground #ffffff

# COLORS (paletă simplă, curată)
color0  #1f222a
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #d0d0d0

color8  #5c6370
color9  #ff6b6b
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# CURSOR STYLE
cursor_shape block

# TABS (dacă le folosești)
tab_bar_style powerline
active_tab_foreground #ffffff
active_tab_background #2a2d35
inactive_tab_foreground #888888
inactive_tab_background #1f222a

window_margin_width 0
